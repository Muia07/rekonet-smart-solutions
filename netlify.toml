# Netlify Configuration for Rekonet Systems
# Static React bundle deployment

[build]
  # Validate static assets before deploy
  command = "npm run build"
  
  # Publish the built static site from dist/
  publish = "dist"
  
  # Environment variables
  [build.environment]
    NODE_VERSION = "18"
    NPM_FLAGS = "--legacy-peer-deps"

# Production context
[context.production]
  [context.production.environment]
    NODE_ENV = "production"

# Deploy Preview context
[context.deploy-preview]
  [context.deploy-preview.environment]
    NODE_ENV = "staging"

# Branch Deploy context
[context.branch-deploy]
  [context.branch-deploy.environment]
    NODE_ENV = "staging"

# SPA Redirect - All routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Redirect www to non-www
[[redirects]]
  from = "https://www.rekonetsystems.netlify.app/*"
  to = "https://rekonetsystems.netlify.app/:splat"
  status = 301
  force = true

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://rekonetsystems.netlify.app/*"
  to = "https://rekonetsystems.netlify.app/:splat"
  status = 301
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"
    
    # Content Security Policy
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://aiqodirqebqptnycmgwt.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://aiqodirqebqptnycmgwt.supabase.co; frame-ancestors 'none';"
    
    # CORS headers
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache stable image names briefly and revalidate after they expire. Only
# content-fingerprinted files under /assets/ receive an immutable cache policy.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The checked-in CSS and JS bundles use stable filenames, so every request must
# revalidate them. A year-long immutable policy would make deploys appear stale.
[[headers]]
  for = "/src/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/src/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# HTML files - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# Service Worker - no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

# Web Manifest
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# NOTE: The @netlify/plugin-lighthouse build plugin was removed because it was
# causing the "published with plugin error" production failure. Lighthouse is
# still run separately via the GitHub Actions CI workflow (.github/workflows/lighthouse.yml)
# and does not block Netlify deployments.
#
# Static file protection: Netlify checks for a real file in the publish
# directory BEFORE applying the SPA fallback redirect below. Therefore real
# files such as /googlee03ef9e71d0382e1.html and /Rekonet_v1.0.apk are served
# directly and are never rewritten to /index.html. Only paths without a matching
# file (client-side routes like /pricing, /downloads) fall through to index.html.
