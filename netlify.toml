# Netlify Configuration for Rekonet Systems Website
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets
  publish = "."
  
  # Default build command
  command = "echo 'Static site - no build required'"
  
  # Environment variables
  [build.environment]
    NODE_VERSION = "18"
    PYTHON_VERSION = "3.9"

# Production context
[context.production]
  # Environment variables for production
  [context.production.environment]
    NODE_ENV = "production"
    ANALYTICS_ID = "GA_MEASUREMENT_ID"

# Deploy Preview context
[context.deploy-preview]
  # Environment variables for deploy previews
  [context.deploy-preview.environment]
    NODE_ENV = "staging"

# Branch Deploy context
[context.branch-deploy]
  # Environment variables for branch deploys
  [context.branch-deploy.environment]
    NODE_ENV = "staging"

# Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = false

# Redirect www to non-www
[[redirects]]
  from = "https://www.rekonetsystems.netlify.app/*"
  to = "https://rekonetsystems.netlify.app/:splat"
  status = 301
  force = true

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://rekonetsystems.netlify.app/*"
  to = "https://rekonetsystems.netlify.app/:splat"
  status = 301
  force = true

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"
    
    # CORS headers (if needed)
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for CSS and JS
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

# Headers for HTML files
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# Headers for JSON files
[[headers]]
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Headers for XML files
[[headers]]
  for = "*.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/xml; charset=utf-8"

# Headers for web manifest
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Headers for service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

# Edge functions (if needed)
# [[edge_functions]]
#   path = "/api/*"
#   function = "api-handler"

# Plugins
[[plugins]]
  package = "@netlify/plugin-lighthouse"

# Lighthouse configuration
[plugins.inputs]
  # Run Lighthouse on deploy
  audits = [
    "performance",
    "accessibility",
    "best-practices",
    "seo"
  ]
  
  # Performance thresholds
  [plugins.inputs.thresholds]
    performance = 90
    accessibility = 90
    best-practices = 90
    seo = 90

# Forms configuration
[build.processing.html]
  pretty_urls = true

# Split testing
[[split_tests]]
  branches = ["main", "staging"]
  distribution = [90, 10]

# Environment variables (set in Netlify UI)
# These are examples - set actual values in Netlify dashboard
[template.environment]
  GA_MEASUREMENT_ID = "G-XXXXXXXXXX"
  HOTJAR_ID = "XXXXXXXX"
  CONTACT_EMAIL = "rekonetsystems@outlook.com"
  CONTACT_PHONE = "+254745522104"