    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical CSS - prevents FOUC */
      *,:before,:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
      body{margin:0;line-height:inherit;background-color:#fff;color:#0a2540}
      h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
      a{color:inherit;text-decoration:inherit}
      img,video{max-width:100%;height:auto;display:block}

      /* Skip link for accessibility */
      .skip-link{position:absolute;top:-40px;left:6px;background:#00b4d8;color:#fff;padding:8px 16px;text-decoration:none;border-radius:4px;z-index:9999;font-weight:600}
      .skip-link:focus{top:6px}

      /* Focus styles for accessibility */
      *:focus-visible{outline:2px solid #00b4d8;outline-offset:2px}

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce){
        *,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
      }

      /* Loading state */
      #root:empty{display:flex;align-items:center;justify-content:center;min-height:100vh}
      #root:empty::after{content:'';width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#00b4d8;border-radius:50%;animation:spin 0.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {

            })

            });
